name = "counselhound-svelte"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "acfd0d687a1b0d6a0d0664ca42c9b50f"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "frankowskifirm-blog"
database_id = "3f7a25da-e6bb-48ec-bac6-2fa1b977fb41"

[ai]
binding = "AI"

[vars]
PUBLIC_GA_ID = "G-47Y2TV1GSB"
# ADMIN_PASSWORD removed 2026-09-04 — it was dead config, never read anywhere in the app.
# Real admin auth is email OTP (see src/routes/(admin)/admin/login) signed with the
# ADMIN_OTP_SECRET Cloudflare secret, not a static password.
# RESEND_API_KEY is stored as a Cloudflare secret — do not add here
